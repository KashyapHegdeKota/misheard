[project]
name = "misheard"
version = "0.1.0"
description = "Data pipeline for Misheard: a map of where speech models get it wrong"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "soundfile",
    "librosa",
    "faster-whisper",
    "transformers",
    "huggingface_hub",
    "whisper-normalizer",
    "umap-learn",
    "jiwer",
    "rapidfuzz",
    "requests",
    "tqdm",
    "sherpa-onnx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["misheard"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
